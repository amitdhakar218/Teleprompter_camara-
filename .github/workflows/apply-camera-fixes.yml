name: Apply Camera Fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[camera-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply zoom and native gallery fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          old_import = "import { saveVideoToGallery } from './utils/videoGalleryStorage';"
          new_import = "import { saveVideoToGallery } from './utils/videoGalleryStorage';\nimport { saveVideoToPhoneStorage } from './utils/nativeStorage';"
          if old_import in text and "saveVideoToPhoneStorage" not in text:
              text = text.replace(old_import, new_import, 1)

          old_handler = """      recorder.onstop = () => {"""
          new_handler = """      recorder.onstop = async () => {"""
          if old_handler in text:
              text = text.replace(old_handler, new_handler, 1)

          old_auto_download = '''        // 2. Automatically trigger device download attempt
        try {
          const ext = (selectedMime && selectedMime.includes('mp4')) ? 'mp4' : 'webm';
          const filename = `Camera_Video_${timestamp}.${ext}`;
          const downloadAnchor = document.createElement('a');
          downloadAnchor.href = videoUrl;
          downloadAnchor.download = filename;
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          setTimeout(() => {
            document.body.removeChild(downloadAnchor);
          }, 1500);
        } catch (autoSaveErr) {
          console.warn('Auto download trigger warning:', autoSaveErr);
        }
'''
          new_native_save = '''        // 2. Automatically save the finished recording to the Android Gallery.
        // The native bridge uses MediaStore/Movies/Teleprompter and streams the Blob in chunks.
        try {
          const nativeSaveResult = await saveVideoToPhoneStorage(fullBlob, timestamp);
          if (!nativeSaveResult.success) {
            console.warn('Automatic native gallery save failed:', nativeSaveResult.message);
          }
        } catch (autoSaveErr) {
          console.warn('Automatic native gallery save error:', autoSaveErr);
        }
'''
          if old_auto_download in text:
              text = text.replace(old_auto_download, new_native_save, 1)
          else:
              raise SystemExit('Expected App.tsx auto-download block was not found')

          app.write_text(text, encoding='utf-8')

          cam = Path('src/components/CameraView.tsx')
          text = cam.read_text(encoding='utf-8')

          old_class = "className={`w-full h-full ${framingMode === 'contain' ? 'object-contain' : 'object-cover'} transition-transform duration-100 will-change-transform`}"
          new_class = "className=\"w-full h-full object-contain transition-transform duration-100 will-change-transform\""
          if old_class in text:
              text = text.replace(old_class, new_class, 1)
          else:
              raise SystemExit('Expected CameraView framing class was not found')

          old_scale = """  const visualScale = hasHardwareZoom && zoomLevel >= (capabilities.min || 1)
    ? 1
    : effectiveZoom;
"""
          new_scale = """  // Never apply CSS zoom implicitly. Hardware zoom is used only when the user
  // selects a zoom value above 1x; 1x must remain an uncropped native frame.
  const visualScale = zoomLevel > 1 && !hasHardwareZoom ? effectiveZoom : 1;
"""
          if old_scale in text:
              text = text.replace(old_scale, new_scale, 1)
          else:
              raise SystemExit('Expected CameraView visualScale block was not found')

          cam.write_text(text, encoding='utf-8')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/CameraView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent camera crop and auto-save recordings [camera-fix]"
          git push