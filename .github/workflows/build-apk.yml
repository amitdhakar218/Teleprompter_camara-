name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build --if-present

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Update AGP and SDK Versions
        working-directory: ./android
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' variables.gradle || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' variables.gradle || true
          sed -i 's/com.android.tools.build:gradle:8.7.3/com.android.tools.build:gradle:8.9.1/g' build.gradle || true

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teleprompter-Camera-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
