<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Outer camera housing ring -->
  <circle cx="256" cy="256" r="168" fill="url(#lensGrad)" stroke="url(#ringGrad)" stroke-width="12" filter="url(#glow)" />
  
  <!-- Optical inner lens ring -->
  <circle cx="256" cy="256" r="124" fill="#090d16" stroke="rgba(255,255,255,0.18)" stroke-width="6" />
  
  <!-- Aperture glass sheen -->
  <path d="M 160 210 Q 256 160 352 210 Q 256 225 160 210 Z" fill="rgba(255,255,255,0.22)" />
  
  <!-- Teleprompter Lines inside lens (reflecting speech text) -->
  <rect x="190" y="235" width="132" height="12" rx="6" fill="#38bdf8" opacity="0.9" />
  <rect x="206" y="260" width="100" height="12" rx="6" fill="#38bdf8" opacity="0.7" />
  <rect x="224" y="285" width="64" height="12" rx="6" fill="#38bdf8" opacity="0.5" />

  <!-- Live Record Dot on top right of camera -->
  <circle cx="360" cy="152" r="24" fill="#ef4444" filter="url(#glow)" />
  <circle cx="360" cy="152" r="12" fill="#ffffff" opacity="0.9" />

  <!-- Camera Flash / Sensor dot top left -->
  <circle cx="152" cy="152" r="16" fill="#334155" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
</svg>
